models:
  llama3.2:
    model: ai/llama3.2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://docker:pass@db:5432/chatstore
      - MCP_GATEWAY_URL=http://mcp-gateway:8811/sse
    extra_hosts:
      - host.docker.internal:host-gateway
    models:
      - llama3.2
    depends_on:
      - mcp-gateway
      - db
      - initialize-db-schema

  mcp-gateway:
    image: docker/agents_gateway:v2
    use_api_socket: true
    command:
      - --transport=sse
      - --servers=brave,wikipedia-mcp
      - --tools=brave_web_search,get_article,get_summary,get_related_topics
    secrets:
      - mcp_secret

  db:
    image: postgres:17.6-alpine
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=chatstore
    volumes:
      - chat_store:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d chatstore"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  initialize-db-schema:
    build:
      context: .
      dockerfile: Dockerfile.initialize-db-schema
    environment:
      - DATABASE_URL=postgresql://docker:pass@db:5432/chatstore
    depends_on:
      db:
        condition: service_healthy

volumes:
  chat_store:

secrets:
  mcp_secret:
    file: ./.mcp.env
